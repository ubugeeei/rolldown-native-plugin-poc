[workspace]
members = [
  "consumers/astro/native",
  "consumers/rsvelte/native",
  "consumers/solid/native",
  "consumers/vize/native",
]
exclude = ["rolldown"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.100"

[workspace.dependencies]
rolldown_plugin_native_abi = { path = "rolldown/crates/rolldown_plugin_native_abi" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
